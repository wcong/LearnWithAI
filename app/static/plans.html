<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习计划 – 探知</title>
    <link rel="stylesheet" href="/static/css/plans.css">
    <link rel="stylesheet" href="/static/css/nav.css">
</head>
<body>

<!-- ====== 登录页 ====== -->
<div class="auth-page" id="authPage">
    <div class="auth-card">
        <div class="auth-logo"><img src="/static/images/logo_180.png" class="auth-logo-img" alt="探知"></div>
        <h1>探知</h1>
        <p class="auth-sub">学习计划</p>
        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin">登录</button>
            <button class="auth-tab" id="tabRegister">注册</button>
        </div>
        <form id="authForm" onsubmit="return false;">
            <label>邮箱 / 用户名</label>
            <input type="text" id="authEmail" placeholder="输入邮箱或用户名" required autocomplete="username">
            <label>密码</label>
            <input type="password" id="authPassword" placeholder="输入密码" required autocomplete="current-password">
            <div id="authRegisterFields" style="display:none;">
                <div id="authRegStep1">
                    <button type="submit" formnovalidate class="auth-btn" id="authRegSendBtn" style="margin-bottom:10px;">发送验证码</button>
                </div>
                <div id="authRegStep2" style="display:none;">
                    <label>验证码</label>
                    <input type="text" id="authRegCode" placeholder="6 位数字验证码" maxlength="6">
                    <label>密码</label>
                    <input type="password" id="authRegPassword" placeholder="至少 4 个字符">
                    <label>确认密码</label>
                    <input type="password" id="authConfirmPassword" placeholder="再次输入密码">
                    <label>昵称（选填）</label>
                    <input type="text" id="authNickname" placeholder="显示名称">
                </div>
            </div>
            <p class="auth-error" id="authError"></p>
            <button type="submit" class="auth-btn" id="authBtn">登录</button>
            <p class="auth-forgot-link" id="authForgotLink" style="margin-top:10px;text-align:center;font-size:12px;color:#909399;cursor:pointer;">忘记密码？</p>
        </form>
        <div id="authForgotPanel" style="display:none;">
            <p style="text-align:center;font-size:14px;color:#606266;margin-bottom:16px;">重置密码</p>
            <div id="authForgotStep1">
                <label>邮箱</label>
                <input type="email" id="authForgotEmail" placeholder="输入注册邮箱">
                <p class="auth-error" id="authForgotError"></p>
                <button type="button" class="auth-btn" id="authForgotSendBtn">发送验证码</button>
            </div>
            <div id="authForgotStep2" style="display:none;">
                <label>验证码</label>
                <input type="text" id="authForgotCode" placeholder="6 位数字验证码" maxlength="6">
                <label>新密码</label>
                <input type="password" id="authForgotNewPassword" placeholder="至少 4 个字符">
                <p class="auth-error" id="authForgotResetError"></p>
                <button type="button" class="auth-btn" id="authForgotResetBtn">重置密码</button>
            </div>
            <p class="auth-forgot-link" id="authForgotBack" style="margin-top:10px;text-align:center;font-size:12px;color:#409eff;cursor:pointer;">← 返回登录</p>
        </div>
    </div>
</div>

<!-- ====== 主页面 ====== -->
<div class="app-page" id="appPage" style="display:none;">
    <!-- 顶部导航 -->
    <header class="page-header">
        <div class="header-left">
            <a href="/static/index.html" class="header-logo" title="返回首页"><img src="/static/images/logo_180.png" class="header-logo-img" alt="探知"> 探知</a>
        </div>
        <nav class="header-nav">
            <a href="/domain" class="nav-link" data-page="domain">📚 <span class="nav-icon-text">学习领域</span></a>
            <a href="/notes" class="nav-link" data-page="notes">📝 <span class="nav-icon-text">学习笔记</span></a>
            <a href="/static/skills.html" class="nav-link" data-page="skills">⚙️ <span class="nav-icon-text">技能管理</span></a>
            <a href="/plans" class="nav-link active" data-page="plans">✅ <span class="nav-icon-text">学习计划</span></a>
            <a href="/plan" class="nav-link" data-page="plan">💡 <span class="nav-icon-text">AI 规划</span><span class="nav-badge">实验</span></a>
        </nav>
        <div class="header-right">
            <button class="notif-btn" id="notifBtn" title="浏览器提醒设置">🔕</button>
            <span class="user-badge" id="userBadge"></span>
            <button class="logout-btn" id="logoutBtn" title="退出登录">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>退出</span>
            </button>
        </div>
    </header>

    <!-- 计划页面主体 -->
    <div class="plans-body">
        <!-- 顶部统计栏 -->
        <div class="plans-stats-bar">
            <div class="stats-card stats-today" id="statsToday">
                <div class="stats-num" id="statTodayNum">0</div>
                <div class="stats-label">今日要学</div>
            </div>
            <div class="stats-card stats-overdue" id="statsOverdue">
                <div class="stats-num" id="statOverdueNum">0</div>
                <div class="stats-label">已逾期</div>
            </div>
            <div class="stats-card stats-total" id="statsTotal">
                <div class="stats-num" id="statTotalNum">0</div>
                <div class="stats-label">总计</div>
            </div>
            <button class="stats-completed-btn" id="btnCompleted">📋 查看已完成</button>
        </div>

        <!-- 计划列表 -->
        <div class="plans-list" id="plansList">
            <div class="loading-text">加载中...</div>
        </div>

        <!-- 空状态提示（由 JS 动态展示） -->
        <div class="plans-empty" id="plansEmpty" style="display:none;">
            <div class="empty-icon">📋</div>
            <div class="empty-text">暂无学习计划</div>
            <div class="empty-hint">点击右下角 + 创建你的第一个计划</div>
        </div>
    </div>

    <!-- 浮动新建按钮 -->
    <button class="fab-btn" id="btnCreatePlan" title="新建计划">+</button>
</div>

<!-- ====== 创建/编辑计划模态框 ====== -->
<div class="modal-overlay" id="editOverlay">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title" id="editTitle">新建学习计划</span>
            <button class="modal-close" id="btnCloseEdit">✕</button>
        </div>
        <div class="modal-body">
            <label>计划标题 *</label>
            <input type="text" id="editTitleInput" placeholder="例如：学习 React Hooks">

            <label>描述（选填）</label>
            <textarea id="editDescInput" rows="3" placeholder="描述计划内容..."></textarea>

            <label>计划时间 *</label>
            <input type="datetime-local" id="editDateInput">

            <label>关联领域（选填）</label>
            <select id="editAreaSelect">
                <option value="">— 不关联 —</option>
            </select>

            <div id="editParentField" style="display:none;">
                <label>父计划</label>
                <select id="editParentSelect" disabled>
                    <option value="">— 顶级计划 —</option>
                </select>
            </div>

            <input type="hidden" id="editPlanId" value="">
            <input type="hidden" id="editParentId" value="">

            <div class="modal-actions">
                <button id="btnEditCancel">取消</button>
                <button class="btn-primary" id="btnEditSave">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- ====== 已完成计划弹窗 ====== -->
<div class="completed-overlay" id="completedOverlay">
    <div class="completed-modal">
        <div class="completed-header">
            <span class="completed-title">✅ 已完成计划</span>
            <button class="completed-close" id="btnCloseCompleted">✕</button>
        </div>
        <div class="completed-body" id="completedBody">
            <div class="loading-text">加载中...</div>
        </div>
    </div>
</div>

<!-- ====== 删除确认弹窗 ====== -->
<div class="modal-overlay" id="deleteOverlay">
    <div class="modal-box modal-box-sm">
        <div class="modal-header">
            <span class="modal-title">确认删除</span>
            <button class="modal-close" id="btnCloseDelete">✕</button>
        </div>
        <div class="modal-body">
            <p id="deleteConfirmText" style="margin-bottom:16px;">确认删除此计划？</p>
            <div class="modal-actions">
                <button id="btnDeleteCancel">取消</button>
                <button class="btn-danger" id="btnDeleteConfirm">删除</button>
            </div>
        </div>
    </div>
</div>

<!-- ====== 通知引导弹窗 ====== -->
<div class="notif-guide-overlay" id="notifGuideOverlay">
    <div class="notif-guide-box">
        <div class="notif-guide-title">🔔 开启浏览器提醒</div>
        <div class="notif-guide-step">1. 点击地址栏左侧的 <code>🔒</code> 或 <code>ℹ️</code> 图标</div>
        <div class="notif-guide-step">2. 找到 <strong>"通知"</strong> 或 <strong>"Notification"</strong> 选项</div>
        <div class="notif-guide-step">3. 将其改为 <strong>"允许"</strong></div>
        <div class="notif-guide-step" style="margin-top:10px;color:#8E8E93;">之后计划到期前 15 分钟会自动弹出提醒</div>
        <button class="notif-guide-close" id="btnCloseNotifGuide">知道了</button>
    </div>
</div>

<script src="/static/js/plans.js"></script>
</body>
</html>
