<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探知 – AI 辅助深度学习平台</title>
    <link rel="stylesheet" href="/static/css/home.css">
</head>
<body>
    <div class="home-page">
        <!-- 顶部品牌区 -->
        <header class="home-header">
            <a href="/static/index.html" class="home-brand-link" title="返回首页">
                <div class="home-logo"><img src="/static/images/logo_180.png" class="home-logo-img" alt="探知"></div>
                <h1 class="home-title">探知</h1>
            </a>
            <p class="home-subtitle">AI 辅助深度学习平台</p>
        </header>

        <!-- 导航卡片 -->
        <div class="home-cards" id="homeCards">
            <a href="/domain" class="home-card" id="cardDomain">
                <div class="card-icon">📚</div>
                <div class="card-title">学习领域</div>
                <div class="card-desc">管理知识领域，与 AI 对话学习</div>
            </a>
            <a href="/notes" class="home-card" id="cardNotes">
                <div class="card-icon">📝</div>
                <div class="card-title">学习笔记</div>
                <div class="card-desc">专注笔记编辑，随心记录知识</div>
            </a>
            <a href="/static/skills.html" class="home-card" id="cardSkills">
                <div class="card-icon">⚙️</div>
                <div class="card-title">技能管理</div>
                <div class="card-desc">管理 AI 技能模板，定制学习助手</div>
            </a>
            <a href="/plans" class="home-card" id="cardPlans">
                <div class="card-icon">✅</div>
                <div class="card-title">学习计划</div>
                <div class="card-desc">管理待办的学习计划，追踪学习进度</div>
            </a>
            <a href="/plan" class="home-card home-card-experimental" id="cardPlan">
                <span class="card-badge">实验</span>
                <div class="card-icon">💡</div>
                <div class="card-title">AI 学习计划</div>
                <div class="card-desc">AI 自动探索并规划学习路径</div>
            </a>
            <!-- 管理员卡片（仅 admin 用户显示，由 JS 控制显隐） -->
            <a href="/plan-checkpoints" class="home-card" id="cardPlanCheckpoints" style="display:none;">
                <span class="card-badge" style="background:linear-gradient(135deg,#6366f1,#409eff);">管理</span>
                <div class="card-icon">📋</div>
                <div class="card-title">Plan 检查点</div>
                <div class="card-desc">浏览 LangGraph 检查点运行记录</div>
            </a>
            <!-- 领域管理卡片（仅 admin 用户显示） -->
            <a href="/area-manage" class="home-card" id="cardAreaManage" style="display:none;">
                <span class="card-badge" style="background:linear-gradient(135deg,#409eff,#6366f1);">管理</span>
                <div class="card-icon">🗂️</div>
                <div class="card-title">领域管理</div>
                <div class="card-desc">管理领域树，批量操作与置顶</div>
            </a>
        </div>

        <!-- 底部状态 -->
        <footer class="home-footer">
            <span id="homeUserStatus">加载中...</span>
        </footer>
    </div>

    <script>
        // 检测登录状态，显示用户信息
        const token = localStorage.getItem('token') || '';
        const saved = localStorage.getItem('user');
        const statusEl = document.getElementById('homeUserStatus');
        if (token && saved) {
            try {
                const user = JSON.parse(saved);
                statusEl.textContent = '👋 欢迎回来，' + user.username;
                // 检查管理员权限，显示管理员卡片
                (async () => {
                    try {
                        const res = await fetch('/api/admin/check', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.is_admin) {
                                document.getElementById('cardPlanCheckpoints').style.display = '';
                                document.getElementById('cardAreaManage').style.display = '';
                            }
                        }
                    } catch {}
                })();
            } catch {
                statusEl.textContent = '🌱 登录以开始学习之旅';
            }
        } else {
            statusEl.textContent = '🌱 登录以开始学习之旅';
        }
    </script>
</body>
</html>
